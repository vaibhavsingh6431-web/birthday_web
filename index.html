<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Pooja</title>
<meta property="og:title" content="Something special for you, Pooja 🛐">
<meta property="og:description" content="A little something I made just for you... open it 💗">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Something special for you, Pooja 🛐">
<meta name="twitter:description" content="A little something I made just for you... open it 💗">
<style>
:root{
  --bg:#1c1410; --ink:#f7ede2; --accent:#e0a458; --card:#2a2019; --line:#4a3a2c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Georgia,'Iowan Old Style',serif;
  line-height:1.6;min-height:100%;
  background-image:radial-gradient(circle at 20% 20%, #2a1f18 0%, var(--bg) 60%);
}

.hero{
  min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem 1.2rem;position:relative;
}
.hero .mark{font-size:1.6rem;margin-bottom:.8rem;opacity:.85}
.hero h1{font-size:clamp(2.1rem,9vw,3.4rem);font-weight:400;margin:0 0 .6rem;letter-spacing:.01em}
.hero-photo{
  width:min(78vw,320px);border-radius:16px;margin:0 0 1.2rem;
  box-shadow:0 12px 30px rgba(0,0,0,.35);border:1px solid var(--line);
}
.hero p{font-size:1.05rem;opacity:.75;max-width:30ch;margin:0}
.letter-section{opacity:0;max-height:0;overflow:hidden;transition:opacity 1s ease;}
.letter-section.reveal{opacity:1;max-height:none;overflow:visible}
.scroll-hint{position:absolute;bottom:2rem;font-size:.85rem;opacity:.5;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.letter{max-width:600px;margin:0 auto;padding:3rem 1.4rem 6rem;}
.box{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2.2rem 1.6rem;
  opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease;
}
.box.show{opacity:1;transform:translateY(0)}
.box h2{font-weight:400;margin:0 0 1.2rem;font-size:1.25rem;color:var(--accent)}
#typed{font-size:1.12rem;white-space:pre-wrap;min-height:14em}
.cursor{display:inline-block;width:2px;background:var(--accent);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

.closing{
  text-align:center;padding:1rem 1.4rem 5rem;opacity:0;transition:opacity 1.2s ease;
}
.closing.show{opacity:1}
.closing .line{font-size:1.4rem;color:var(--accent);margin-bottom:.4rem}
.closing .sub{font-size:.95rem;opacity:.65}

body.locked{overflow:hidden;height:100%}
.content{opacity:0;transition:opacity .9s ease}
.content.reveal{opacity:1}

#gate{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 2.2rem) 1.6rem calc(env(safe-area-inset-bottom,0px) + 2.2rem);
  background:var(--bg);transition:opacity .8s ease,visibility .8s;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
#gate .hint{font-size:1rem;opacity:.75;margin-bottom:2.2rem;max-width:26ch}
.game-area{position:relative;width:min(90vw,360px);height:min(60vh,420px)}
.heart-target{
  position:absolute;font-size:2.4rem;cursor:pointer;user-select:none;
  transition:left .8s ease,top .8s ease;filter:drop-shadow(0 0 8px rgba(224,164,88,.5));
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.stage{display:none;flex-direction:column;align-items:center;position:relative;width:100%;margin:auto 0}
.stage.active{display:flex;animation:stageIn .7s ease}
.stage.leaving{animation:stageOut .5s ease forwards}
@keyframes stageIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes stageOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
.caught-msg{font-size:1.05rem;color:var(--accent);margin-bottom:1.6rem;opacity:0;transition:opacity .5s ease}
.caught-msg.show{opacity:1}

.lock-wrap{margin-bottom:1.8rem;position:relative;width:100px;height:90px}
.lock-visual{position:relative;width:100px;height:90px;transform:scale(.85);transition:transform .3s ease}
.heart-lock{position:relative;width:100px;height:90px;filter:drop-shadow(0 0 14px rgba(224,164,88,.45))}
.heart-lock::before,.heart-lock::after{
  content:"";position:absolute;left:50px;top:0;width:50px;height:80px;
  background:var(--accent);border-radius:50px 50px 0 0;transform:rotate(-45deg);transform-origin:0 100%;
}
.heart-lock::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
.keyhole{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2}
.keyhole .circle{width:13px;height:13px;border-radius:50%;background:var(--bg);margin:0 auto}
.keyhole .stem{width:5px;height:13px;background:var(--bg);margin:-2px auto 0;clip-path:polygon(50% 0,100% 100%,0 100%)}

.lock-visual.melt{animation:melt 1.2s ease forwards}
.lock-visual.crack{animation:crack .6s ease}
.lock-visual.opened{animation:openpop .5s ease forwards}
@keyframes melt{0%{filter:none}55%{filter:blur(1px) hue-rotate(-25deg);transform:scale(.85) scaleY(.85) rotate(2deg)}100%{filter:blur(4px) hue-rotate(-30deg);transform:scale(.85) scaleY(.15) translateY(24px);opacity:.1}}
@keyframes crack{0%,100%{transform:scale(.85) translateX(0)}20%{transform:scale(.85) translateX(-6px) rotate(-4deg)}40%{transform:scale(.85) translateX(6px) rotate(4deg)}60%{transform:scale(.85) translateX(-4px)}80%{transform:scale(.85) translateX(4px)}}
@keyframes openpop{0%{transform:scale(.85)}50%{transform:scale(1.05)}100%{transform:scale(0);opacity:0}}

.choices{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.choice-btn{
  font-family:inherit;font-size:1rem;padding:.8rem 1.3rem;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  transition:transform .2s ease,border-color .2s ease;
}
.choice-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice-btn:active{transform:translateY(0) scale(.97)}
.burst{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:0}
.burst.show{animation:burstpop .9s ease forwards}
@keyframes burstpop{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(2)}}

.reveal-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-10%;font-size:1.2rem;opacity:0;animation:rise linear forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.8)}12%{opacity:.9}100%{opacity:0;transform:translateY(-65vh) scale(1.1)}}
.reveal-text{max-width:26ch;margin:1rem 0 2.2rem;position:relative;z-index:1}
.reveal-text .line{display:block;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease;font-size:1.35rem;margin:.35rem 0;font-style:italic}
.reveal-text .line.show{opacity:1;transform:translateY(0)}
.reveal-text.fire .line{color:#ef8a56;text-shadow:0 0 16px rgba(239,138,86,.55)}
.reveal-text.heartc .line{color:var(--accent);text-shadow:0 0 16px rgba(224,164,88,.45)}
.continue-btn{
  opacity:0;transition:opacity .6s ease;background:none;border:1px solid var(--line);
  color:var(--ink);padding:.7rem 1.4rem;border-radius:999px;font-family:inherit;
  font-size:.9rem;cursor:pointer;position:relative;z-index:1;
}
.continue-btn.show{opacity:1}
.fire-image{display:none;width:min(86vw,340px);border-radius:12px;margin:0 0 1.6rem;opacity:0;transition:opacity 1.4s ease;position:relative;z-index:1;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.fire-image.on{display:block}
.fire-image.show{opacity:1}

#stage-reveal.fire-mode{
  background:radial-gradient(circle at 50% 38%, rgba(224,120,60,.16), transparent 70%);
  border-radius:16px;
}
.reveal-text.fire{animation:flicker 3.2s ease-in-out infinite}
@keyframes flicker{0%,100%{filter:brightness(1)}45%{filter:brightness(1.1)}50%{filter:brightness(.9)}75%{filter:brightness(1.04)}}
.line-text{display:inline-block}
.line-text.heartbeat{animation:heartbeat 1.7s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}36%{transform:scale(1.05)}48%{transform:scale(1)}}

.puzzle-wrap{width:min(84vw,320px);margin:0 auto}
.puzzle-board{
  width:100%;aspect-ratio:1/1;display:grid;gap:3px;
  background:var(--line);border-radius:10px;overflow:hidden;
  border:1px solid var(--line);transition:gap .5s ease;
}
.puzzle-board.solved{gap:0}
.piece{
  background-repeat:no-repeat;cursor:pointer;transition:outline-color .2s ease,transform .2s ease;
  outline:2px solid transparent;outline-offset:-2px;
}
.piece.selected{outline-color:var(--accent)}
.piece.hint-move{animation:hintpop .5s ease}
@keyframes hintpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.clue-btn{margin-top:1.4rem;font-size:.9rem}
.puzzle-solved-msg{margin-top:1rem;color:var(--accent);font-size:1rem;opacity:0;transition:opacity .6s ease}
.puzzle-solved-msg.show{opacity:1}

.closing{position:relative;padding-bottom:6rem}
.cake-caption{font-size:1.05rem;color:var(--accent);margin-bottom:1.2rem;transition:opacity .5s ease;min-height:3em}
.cake-wrap{width:min(76vw,300px);margin:0 auto 1.4rem;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.cake-wrap svg{width:100%;height:auto;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px #ffb347)}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
.smoke{opacity:0;transform-box:fill-box;transform-origin:center}
.candles-out .flame{animation:none;opacity:0;transition:opacity .35s ease}
.candles-out .smoke{animation:smoke 1.7s ease-out forwards}
@keyframes smoke{0%{opacity:.55;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-30px) scale(1.7)}}
#slice{transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:0% 100%}
.cut #slice{transform:translate(38px,10px) rotate(7deg)}
#cutline{stroke-dasharray:94;stroke-dashoffset:94;opacity:0}
.cutting #cutline{opacity:1;animation:cutdraw .5s ease forwards}
@keyframes cutdraw{to{stroke-dashoffset:0}}
.cut #cutline{opacity:0;transition:opacity .3s}
.cut-btn{opacity:0;pointer-events:none;transition:opacity .6s ease;margin-bottom:1.4rem}
.cut-btn.show{opacity:1;pointer-events:auto}
.flame.out{animation:none;opacity:0;transition:opacity .35s ease}
.smoke.out{animation:smoke 1.7s ease-out forwards}
.final{opacity:0;max-height:0;overflow:hidden;transition:opacity 1.2s ease}
.final.show{opacity:1;max-height:200px}

.bouquet-section{display:none;flex-direction:column;align-items:center;margin-top:2.4rem}
.bouquet-section.on{display:flex}
.bouquet{width:min(70vw,260px);height:auto;opacity:0;transform:translateY(20px);transition:opacity 1.2s ease,transform 1.2s ease;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.bouquet-section.show .bouquet{opacity:1;transform:translateY(0)}
.rp{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.bouquet-section.show .rp{animation:rosepop .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes rosepop{to{transform:scale(1)}}
.sorry-text{margin:1.2rem 0 1rem;font-size:1.3rem;color:var(--accent);font-style:italic;min-height:1.6em;transition:opacity .6s ease;opacity:0}
.bouquet-section.show .sorry-text{opacity:1}
#iloveBtn{opacity:0;transition:opacity .8s ease,transform .2s ease}
.bouquet-section.show #iloveBtn{opacity:1}
.two-btns{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;opacity:0;transition:opacity .8s ease}
.bouquet-section.show .two-btns{opacity:1}
.next-page{display:none;max-width:560px;margin:2.2rem auto 5rem;padding:0 1.4rem}
.next-page.on{display:block}
.next-page .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2rem 1.5rem;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.next-page .box.show{opacity:1;transform:translateY(0)}
#nextTyped{font-size:1.1rem;white-space:pre-wrap;text-align:left}

</style>
</head>

const board=document.getElementById('puzzleBoard');
const stageCatch=document.getElementById('stage-catch');
const stageLock=document.getElementById('stage-lock');
const caughtMsg=document.getElementById('caughtMsg');
const clueBtn=document.getElementById('clueBtn');
const puzzleHint=document.getElementById('puzzleHint');

board.style.gridTemplateColumns=`repeat(${GRID},1fr)`;
board.style.gridTemplateRows=`repeat(${GRID},1fr)`;

// slots[i] = which original piece currently sits in slot i
let slots=[...Array(GRID*GRID).keys()];
function shuffle(arr){
  do{
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  } while(arr.every((v,i)=>v===i)); // avoid accidental solved state
  return arr;
}
shuffle(slots);

let selected=null;

function renderBoard(){
  board.innerHTML='';
  slots.forEach((pieceIdx,slotIdx)=>{
    const col=pieceIdx%GRID, row=Math.floor(pieceIdx/GRID);
    const div=document.createElement('div');
    div.className='piece';
    div.dataset.slot=slotIdx;
    div.style.backgroundImage=`url(${PHOTO_SRC})`;
    div.style.backgroundSize=`${GRID*100}% ${GRID*100}%`;
    div.style.backgroundPosition=`${(col/(GRID-1))*100}% ${(row/(GRID-1))*100}%`;
    div.addEventListener('click',()=>onPieceClick(slotIdx));
    board.appendChild(div);
  });
}
renderBoard();

function onPieceClick(slotIdx){
  const el=board.querySelector(`[data-slot="${slotIdx}"]`);
  if(selected===null){
    selected=slotIdx;
    el.classList.add('selected');
  } else if(selected===slotIdx){
    el.classList.remove('selected');
    selected=null;
  } else {
    [slots[selected],slots[slotIdx]]=[slots[slotIdx],slots[selected]];
    board.querySelector(`[data-slot="${selected}"]`)?.classList.remove('selected');
    selected=null;
    renderBoard();
    checkSolved();
  }
}

function spawnMiniHearts(container){
  const emojiSet=['💗','✨'];
  let n=0;
  const iv=setInterval(()=>{
    if(n>10){clearInterval(iv);return;}
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emojiSet[Math.floor(Math.random()*emojiSet.length)];
    p.style.left=(Math.random()*90)+'%';
    p.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    container.appendChild(p);
    setTimeout(()=>p.remove(),3400);
    n++;
  },90);
}

function checkSolved(){
  if(slots.every((v,i)=>v===i)){
    clueBtn.disabled=true;
    board.classList.add('solved');
    puzzleHint.textContent="There you are 💗";
    spawnMiniHearts(document.getElementById('puzzleParticles'));
    setTimeout(()=>{
      stageCatch.classList.add('leaving');
      setTimeout(()=>{
        stageCatch.classList.remove('active','leaving');
        stageLock.classList.add('active');
        setTimeout(()=>caughtMsg.classList.add('show'),150);
      },500);
    },1100);
  }
}

clueBtn.addEventListener('click',()=>{
  for(let slotIdx=0;slotIdx<slots.length;slotIdx++){
    if(slots[slotIdx]!==slotIdx){
      const srcSlot=slots.indexOf(slotIdx);
      [slots[srcSlot],slots[slotIdx]]=[slots[slotIdx],slots[srcSlot]];
      renderBoard();
      const moved=board.querySelector(`[data-slot="${slotIdx}"]`);
      moved?.classList.add('hint-move');
      checkSolved();
      break;
    }
  }
});

// --- Stage 2: fire or heart choice ---
const lockVisual=document.getElementById('lockVisual');
const burst=document.getElementById('burst');
const gate=document.getElementById('gate');
const contentEl=document.getElementById('content');
const stageReveal=document.getElementById('stage-reveal');

function unlockPage(){
  document.body.classList.remove('locked');
  setTimeout(()=>{
    gate.classList.add('hidden');
    contentEl.classList.add('reveal');
  },500);
}

// --- Stage 3: poetic reveal, then continue into the letter ---
function showReveal(type){
  stageLock.classList.remove('active');
  stageReveal.classList.add('active');
  stageReveal.classList.toggle('fire-mode', type==='fire');
  const fireImg=document.getElementById('fireImage');
  fireImg.classList.remove('on','show');

  const textEl=document.getElementById('revealText');
  textEl.className='reveal-text '+(type==='fire'?'fire':'heartc');

  const lines = type==='heart' ? [
    "I think...",
    "if you choose this,",
    "then I am still,",
    "somewhere,",
    "in that soft corner",
    "of your heart."
  ] : [
    "To my all-time favourite,",
    "I miss you every time —",
    "because I can't talk to you,",
    "can't see you,",
    "can't hear your voice,",
    "which is still my favourite sound.",
    "You come into my thoughts anyway,",
    "and I feel lonely without you.",
    "You're not just a memory —",
    "you're the best chapter of my life.",
    "I still open your DM sometimes,",
    "my finger just hovering there.",
    "But then I stop myself,",
    "afraid that reaching out",
    "might turn your good day into a bad one,",
    "just because of me.",
    "I love you the most, babee.",
    "I was afraid of this only.",
    "I just want you, only you,",
    "and nothing else, yaar 💝😭",
    "I love everything with you...",
    "You entered my life,",
    "and now I want you as much as possible.",
    "Please be with me, I need you, yaar.",
    "Nowadays I only think about",
    "what I should do",
    "to make you fall in love with me again."
  ];
  const gap = type==='fire' ? 900 : 700;
  textEl.innerHTML = lines.map(l=>`<span class="line"><span class="line-text">${l}</span></span>`).join('');
  const spans=textEl.querySelectorAll('.line');
  spans.forEach((s,idx)=>setTimeout(()=>{
    s.classList.add('show');
    const r=s.getBoundingClientRect();
    if(r.bottom>window.innerHeight-90) s.scrollIntoView({behavior:'smooth',block:'center'});
  }, 400+idx*gap));
  if(type==='fire'){
    setTimeout(()=>{
      const last=spans[spans.length-1]?.querySelector('.line-text');
      last?.classList.add('heartbeat');
    }, 400+(spans.length-1)*gap+300);
  }

  const particlesEl=document.getElementById('revealParticles');
  const emojiSet = type==='heart' ? ['💗','✨','💫'] : ['🔥','🕯️','✨'];
  let pcount=0;
  const pInterval=setInterval(()=>{
    if(pcount>18){clearInterval(pInterval);return;}
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emojiSet[Math.floor(Math.random()*emojiSet.length)];
    p.style.left=(Math.random()*90)+'%';
    p.style.animationDuration=(type==='fire'?(3.2+Math.random()*2.4):(2.6+Math.random()*2))+'s';
    particlesEl.appendChild(p);
    setTimeout(()=>p.remove(),5600);
    pcount++;
  },type==='fire'?420:380);

  const continueBtn=document.getElementById('continueBtn');
  const textDone=500+spans.length*gap+300;
  if(type==='fire'){
    setTimeout(()=>{
      fireImg.classList.add('on');
      requestAnimationFrame(()=>{
        fireImg.classList.add('show');
        setTimeout(()=>fireImg.scrollIntoView({behavior:'smooth',block:'center'}),200);
      });
    }, textDone+600);
    setTimeout(()=>continueBtn.classList.add('show'), textDone+600+2200);
  } else {
    setTimeout(()=>continueBtn.classList.add('show'), textDone);
  }
  continueBtn.onclick=()=>{ clearInterval(pInterval); unlockPage(); };
}

// --- Closing: cake, candles, cut, birthday tune ---
(function(){
  const wrap=document.getElementById('cakeWrap');
  const caption=document.getElementById('cakeCaption');
  const finalMsg=document.getElementById('finalMsg');
  const parts=document.getElementById('cakeParticles');
  let state=0, ctx=null;
  function unlockAudio(){
    try{
      if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      // silent primer so iOS fully unlocks the audio context on this exact tap
      const o=ctx.createOscillator(), g=ctx.createGain();
      g.gain.value=0; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.01);
    }catch(e){}
  }

  function setCaption(t){
    caption.style.opacity=0;
    setTimeout(()=>{caption.innerHTML=t;caption.style.opacity=1;},350);
  }
  function confetti(){
    const set=['💗','✨','🎉','💖','🎂'];
    let n=0;
    const iv=setInterval(()=>{
      if(n>28){clearInterval(iv);return;}
      const el=document.createElement('div');
      el.className='particle';
      el.textContent=set[Math.floor(Math.random()*set.length)];
      el.style.left=(Math.random()*92)+'%';
      el.style.animationDuration=(2.4+Math.random()*2)+'s';
      parts.appendChild(el);
      setTimeout(()=>el.remove(),5000);
      n++;
    },110);
  }
  // "Happy Birthday to You" (public-domain melody) synthesised in the browser
  function playTune(){
    try{
      if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      const N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
      const seq=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
                 ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
                 ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
                 ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
      const beat=0.44;
      let t=ctx.currentTime+0.1;
      seq.forEach(([note,b])=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='triangle'; o.frequency.value=N[note];
        const dur=b*beat;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.22,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+dur*.95);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t+dur);
        t+=dur;
      });
    }catch(e){}
  }

  const cutBtn=document.getElementById('cutBtn');
  let blown=0;
  function onTap(){
    if(state!==0) return;
    if(blown===0) unlockAudio();
    const fl=wrap.querySelectorAll('.flame'), sm=wrap.querySelectorAll('.smoke');
    if(blown<3){ fl[blown].classList.add('out'); sm[blown].classList.add('out'); blown++; }
    if(blown===3){
      state=1;
      setCaption('Wish made 💫');
      setTimeout(()=>cutBtn.classList.add('show'),900);
    }
  }
  function doCut(){
    if(state!==1) return;
    state=2;
    unlockAudio();
    cutBtn.classList.remove('show');
    wrap.classList.add('cutting');
    setTimeout(()=>{
      wrap.classList.add('cut');
      playTune();
      confetti();
      caption.style.opacity=0;
      setTimeout(()=>{
        caption.style.display='none';
        finalMsg.classList.add('show');
        finalMsg.scrollIntoView({behavior:'smooth',block:'center'});
        setTimeout(()=>window.showBouquet&&window.showBouquet(),2400);
      },1200);
    },550);
  }
  cutBtn.addEventListener('click',doCut);
  wrap.addEventListener('click',onTap);
  wrap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap();}});
})();

// --- Bouquet + "I love you" button ---
(function(){
  const sec=document.getElementById('bouquetSection');
  const txt=document.getElementById('sorryText');
  const btn=document.getElementById('iloveBtn');
  const parts=document.getElementById('cakeParticles');
  const lines=['I love you babe 💗','Sorry babe 🥺'];
  let k=0, iv=null, done=false;
  window.showBouquet=function(){
    sec.classList.add('on');
    requestAnimationFrame(()=>{
      sec.classList.add('show');
      setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'center'}),300);
    });
    iv=setInterval(()=>{
      if(done) return;
      txt.style.opacity=0;
      setTimeout(()=>{ if(done) return; k=(k+1)%lines.length; txt.textContent=lines[k]; txt.style.opacity=1; },600);
    },2600);
  };
  const skipBtn=document.getElementById('skipBtn');
  const twoBtns=document.querySelector('.two-btns');
  function heartBurst(){
    const set=['💗','🌹','🌸','💖','✨'];
    let n=0;
    const t=setInterval(()=>{
      if(n>36){clearInterval(t);return;}
      const el=document.createElement('div');
      el.className='particle';
      el.textContent=set[Math.floor(Math.random()*set.length)];
      el.style.left=(Math.random()*92)+'%';
      el.style.animationDuration=(2.6+Math.random()*2.2)+'s';
      parts.appendChild(el);
      setTimeout(()=>el.remove(),5200);
      n++;
    },110);
  }
  btn.addEventListener('click',()=>{
    if(done) return;
    done=true; clearInterval(iv);
    twoBtns.style.display='none';
    txt.style.opacity=0;
    setTimeout(()=>{ txt.textContent='I love you the most, babe 💗'; txt.style.opacity=1; },500);
    heartBurst();
  });
  skipBtn.addEventListener('click',()=>{
    if(done) return;
    done=true; clearInterval(iv);
    twoBtns.style.display='none';
    txt.style.opacity=0;

    const nextPage=document.getElementById('nextPage');
    const nextBox=document.getElementById('nextBox');
    const nextTyped=document.getElementById('nextTyped');
    const msg="I still try hard to be accepted by you, and for your love for me...\n\nBecause I sincerely love you the mosttttttt... ♾️\n\nAnd one more thing — hamari anniversary aane wali hai yaar, 4th. So please, sahi kar do na hamare beech. Tum 12 November tak, bas last chance... shai kar lo na.";
    nextPage.classList.add('on');
    requestAnimationFrame(()=>{
      nextBox.classList.add('show');
      setTimeout(()=>nextPage.scrollIntoView({behavior:'smooth',block:'start'}),300);
    });
    let i=0;
    function typeNext(){
      if(i<=msg.length){
        nextTyped.textContent=msg.slice(0,i);
        nextTyped.innerHTML+='<span class="cursor">&nbsp;</span>';
        i++;
        setTimeout(typeNext,28);
      }
    }
    setTimeout(typeNext,500);
  });
})();
</script>
